name: Production CI Pipeline with MongoDB

on:
  push:
    branches: [ "main", "master" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests / Healthcheck Test
        env:
          MONGO_URI: mongodb://localhost:27017/testdb
          PORT: 3000
        run: |
          node index.js &
          sleep 5
          curl --fail http://localhost:3000/health || exit 1