name: Test Product CI Prod

on:
  push:
    branches: [ main ]

jobs:
  test-prod:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Start API
        run: |
          nohup npm start > api.log 2>&1 &
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run tests
        run: npm test
  