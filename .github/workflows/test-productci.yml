name: Test Product CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env for CI
        run: |
          echo "PORT=3000" >> .env
          echo "MONGO_URI=mongodb://mongodb:27017/productdb" >> .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Run tests
        run: npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v