name: CD Docker Hub

on:
  workflow_run:
    workflows: ["Test Product CI Prod"]   # phải trùng chính xác dòng name: của file CI
    types: [completed]
    branches: [ main ]
  workflow_dispatch:                       # cho phép bấm chạy tay trên GitHub

jobs:
  deploy:
    # Chỉ chạy khi CI xanh (hoặc khi bấm chạy tay)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout đúng commit đã test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.event.workflow_run.head_sha || github.sha }}